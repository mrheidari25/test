name: Pick Old Branches & Owners

on:
  workflow_dispatch:

jobs:
  PickOldBranchesAndOwners:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0  # Needed to retrieve full commit log

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.x'

      - name: Install GitHub CLI
        run: sudo apt-get install -y gh

      - name: Find Stale Branches and List Owners
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        run: |
          #AGE_CUTOFF=360 # In days
          AGE_CUTOFF=10 # In days
          #MAIN_BRANCH=master
          MAIN_BRANCH=main

          # Fetch all branches
          git branch -r | grep -v '\->' | sed 's/origin\///' > branches.txt

          contributorsList=()
          # Loop through branches
          while read branch; do
            # Skip main branch
            if [ "$branch" = "master" ] || [ "$branch" = "main" ]; then
              continue
            fi

            # Skip if open PR exists
            open_prs=$(gh pr list --head "$branch" --json number --jq 'length')
            if [ "$open_prs" -gt 0 ]; then
              continue
            fi

            # Get last commit date
            lastCommitDate=$(gh api repos/${{ github.repository }}/commits/$branch --jq '.commit.committer.date')

            # Calculate branch age in days
            branchAgeDays=$(( ($(date -u +%s) - $(date -u -d "$lastCommitDate" +%s)) / 86400 ))

            # Check whether the branch is old enough
            if [ $branchAgeDays -ge $AGE_CUTOFF ]; then
              # Get contributors to the branch
              contributors=$(gh api repos/${{ github.repository }}/compare/$MAIN_BRANCH...$branch --jq '.commits[] | "\(.commit.author.name) (@\(.author.login))"' | sort | uniq)

              BLUE='\033[34m'
              RED='\033[31m'
              GREEN='\033[32m'
              NC='\033[0m'
              printf "BRANCH=${BLUE}%-20s${NC} AGE=${RED}%-20s${NC} OWNER=${GREEN}%s${NC}\n" "$branch" "${branchAgeDays} days old" "$contributors"


              #create an issue
              #gh issue create --title "Test Notification15" --body "@RezaUHH should receive a notification"
              #gh issue create --title "Test Notification16" --body "@RezaUHH should receive a notification" --assignee RezaUHH
              #gh issue create --title "Test Notification13" --body "should receive a notification"


              #create an issue
              contributors=$(gh api repos/${{ github.repository }}/compare/$MAIN_BRANCH...$branch --jq '.commits[] | "\(.commit.author.name) (@\(.author.login))"' | sort | uniq)
              mentions=$(echo "$contributors" | sed 's/^/@/')
              news="The branch ${branch} has been inactive for ${branchAgeDays} days."
              warning="If you are still using this branch, please let us know. Otherwise, we plan to delete it."
              message="${mentions} ${news} ${warning}"
            fi
          done < branches.txt
	  
	      

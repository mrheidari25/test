name: Reza Original YML
on:
  workflow_dispatch:
jobs:
  RezaOriginalArchiveOldBranches:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      
    steps:
      - name: Checkout
        #uses: actions/checkout@v4
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
      
      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.x'
          
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip google-genai

      - name: Install GitHub CLI
        run: sudo apt-get install -y gh

      - name: Filter and Archeive Stale Branches
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
          GEMINI_API_KEY: ${{secrets.GEMINI_API_KEY}}
          
        run: |
          echo "Reza ........"
          AGE_CUTOFF=800 #In days
          Main_Branch=main
          
          #Fetch all branches
          git branch -r | grep -v '\->' | sed 's/origin\///' > branches.txt

          #Loop through branches
          while read branch; do
            echo "Reza inside the loop checking the branch {$branch}"
            #Skip main branch
            if [ "$branch" = "main" ] || [ "$branch" = "master" ]; then
              echo "Skipping the branch: ${branch} ......"
              continue
            fi
            echo "Reza this branch is not main: {$branch}"

            #Skip if open PR exits
            open_prs=$(gh pr list --head "$branch" --json number --jq 'length')           
            if [ ${open_prs} -gt 0 ]; then
              echo "There exist no PR for branch ${branch}"
              continue
            fi 

            
          done < branches.txt

        
        
    

name: Reza Original YML
on:
  workflow_dispatch:
jobs:
  RezaOriginalArchiveOldBranches:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      
    steps:
      - name: Checkout
        #uses: actions/checkout@v4
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
      
      - name: Setup Python
        #uses: actions/python@v6.2
        uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.x'
          
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip google-genai

      - name: Install GitHub CLI
        run: sudo apt-get install -y gh

      - name: Filter and Archeive Stale Branches
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
          GEMINI_API_KEY: ${{secrets.GEMINI_API_KEY}}
        run: |
          AGE_CUTOFF=800 #In days
          Main_Branch=main

          # Fetch all branches
          git branch -r | grep -v '\->' | sed 's/origin\///' > branches.txt

          echo "Reza ........"
          # Loop through branches
          while read branch; do
            echo "  Main branch: ${branch}. Skipping..."
          done
          
          #Fetch all branches
          git branch -r | grep -v '\->' | sed 's/origin\///' > branches.txt

          #Loop through branches
          while read branch; do
            echo $branch
          done
 
        

          
        
